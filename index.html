```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu primeiro VR</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>

    <script type="module">

        import * as THREE from
            'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

        import { VRButton } from
            'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/webxr/VRButton.js';


        // =========================
        // CENA
        // =========================

        const cena = new THREE.Scene();

        cena.background = new THREE.Color(0x202020);


        // =========================
        // CÂMERA
        // =========================

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );


        // =========================
        // RENDERIZADOR
        // =========================

        const renderer = new THREE.WebGLRenderer({
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            window.devicePixelRatio
        );

        // Habilita WebXR
        renderer.xr.enabled = true;

        document.body.appendChild(
            renderer.domElement
        );


        // =========================
        // BOTÃO VR
        // =========================

        document.body.appendChild(
            VRButton.createButton(renderer)
        );


        // =========================
        // CUBO
        // =========================

        const geometria = new THREE.BoxGeometry();

        const material = new THREE.MeshBasicMaterial({
            color: 0x00ff00
        });

        const cubo = new THREE.Mesh(
            geometria,
            material
        );

        // Coloca o cubo na frente
        cubo.position.z = -3;

        cena.add(cubo);


        // =========================
        // ANIMAÇÃO
        // =========================

        function animar() {

            cubo.rotation.x += 0.01;

            cubo.rotation.y += 0.01;

            renderer.render(
                cena,
                camera
            );
        }

        renderer.setAnimationLoop(animar);


        // =========================
        // AJUSTE DA TELA
        // =========================

        window.addEventListener(
            'resize',
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );
            }
        );

    </script>

</body>
</html>
```
